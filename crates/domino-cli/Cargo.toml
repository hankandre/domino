[package]
name = "domino-cli"
version = "0.1.1"
edition = "2024"
description = "CLI and credential broker for the Domino household warranty tracker"
license = "MIT"
repository = "https://github.com/hankandre/domino"

[[bin]]
name = "domino"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
url = "2"
