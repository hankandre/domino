apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: domino
    patch: |-
      - op: replace
        path: /spec/egress/0
        value:
          to:
            # EXAMPLE ONLY: replace with the managed database CIDR or route all
            # database traffic through a cluster egress policy/gateway.
            - ipBlock:
                cidr: 192.0.2.0/24
          ports:
            - protocol: TCP
              port: 5432
