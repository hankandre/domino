name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: domino
          POSTGRES_USER: domino
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domino -d domino"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://domino:ci-database-password@127.0.0.1:5432/domino
      DOMINO_DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - name: Bootstrap and verify a household
        run: |
          password_file="$(mktemp)"
          trap 'rm -f "$password_file"' EXIT
          printf '%s' 'ci-owner-password-2026' > "$password_file"
          bun scripts/bootstrap-owner.mjs \
            --email owner@example.test \
            --name "CI Owner" \
            --password-file "$password_file"
          psql "$DATABASE_URL" -tAc "select count(*) from roles" | grep -qx 4
          psql "$DATABASE_URL" -tAc "select count(*) from actors where kind = 'user'" | grep -qx 1

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Compose model
        run: |
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          POSTGRES_PASSWORD=ci-compose-password \
          PAPERLESS_TOKEN_PATH="$secret_file" \
          DOMINO_OIDC_CLIENT_SECRET_PATH="$secret_file" \
          DOMINO_SESSION_SECRET_PATH="$secret_file" \
            docker compose config --quiet
      - run: docker build --tag domino:ci .
      - name: Verify application image identity
        run: |
          test "$(docker image inspect domino:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint /bin/sh domino:ci -c 'test ! -e /usr/local/bin/domino'
      - run: docker build --file Dockerfile.cli --tag domino-cli:ci .
      - name: Verify standalone CLI image
        run: |
          test "$(docker image inspect domino-cli:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker run --rm domino-cli:ci --version)" = "domino 0.1.1"
