apiVersion: v1
kind: Secret
metadata:
  name: domino
  namespace: domino
type: Opaque
stringData:
  database-url: postgres://domino:replace-me@postgres.domino.svc.cluster.local:5432/domino
  paperless-token: replace-me
  oidc-client-secret: replace-me
  session-secret: replace-with-at-least-32-random-characters
  credential-encryption-key: replace-with-an-independent-32-byte-random-value
