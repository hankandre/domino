apiVersion: batch/v1
kind: Job
metadata:
  name: domino-migrate
  namespace: domino
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: domino-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/hankandre/domino:0.1.0
          args:
            - node_modules/drizzle-kit/bin.cjs
            - migrate
            - --config=drizzle.config.ts
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: domino
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
