name: Release Domino Application

on:
  push:
    tags: ["app-v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  verify:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:release:app

  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/domino
          tags: |
            type=raw,value=staging-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Domino
            org.opencontainers.image.description=Self-hosted household warranty tracker
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true
      - id: migration-metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/domino-migrate
          tags: type=raw,value=staging-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Domino database migrations
            org.opencontainers.image.description=Schema migration image for Domino
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: migration
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.migration-metadata.outputs.tags }}
          labels: ${{ steps.migration-metadata.outputs.labels }}
          provenance: true
          sbom: true
      - name: Promote the complete application image set
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER}/domino-migrate:${version}" \
            "ghcr.io/${OWNER}/domino-migrate:staging-${GITHUB_SHA}"
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER}/domino:${version}" \
            "ghcr.io/${OWNER}/domino:staging-${GITHUB_SHA}"

  publish:
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
