name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run check:roles
      - run: bun run lint
      - run: bun run check
      - run: bun run check:docs
      - run: bun test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run build

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: domino
          POSTGRES_USER: domino
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domino -d domino"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://domino:ci-database-password@127.0.0.1:5432/domino
      DOMINO_DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:migrations
      - run: bun run db:migrate
      - run: bun run test:integration
      - name: Record PostgreSQL 17 query-plan baseline
        run: bun run test:performance > "$RUNNER_TEMP/performance-baseline.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgresql-17-performance-baseline
          path: ${{ runner.temp }}/performance-baseline.json
      - name: Bootstrap and verify a household
        run: |
          password_file="$(mktemp)"
          trap 'rm -f "$password_file"' EXIT
          printf '%s' 'ci-owner-password-2026' > "$password_file"
          bun scripts/bootstrap-owner.mjs \
            --email owner@example.test \
            --name "CI Owner" \
            --password-file "$password_file"
          psql "$DATABASE_URL" -tAc "select count(*) from roles" | grep -qx 6
          psql "$DATABASE_URL" -tAc "select count(*) from actors where kind = 'user'" | grep -qx 1
          psql "$DATABASE_URL" -tAc "select count(*) from roles where lower(name) in ('owner', 'member') and permissions ? 'paperless:discover'" | grep -qx 2
          psql "$DATABASE_URL" -tAc "select count(*) from roles where lower(name) in ('inventory contributor', 'household agent')" | grep -qx 2
          psql "$DATABASE_URL" -tAc "select count(*) from roles where lower(name) = 'inventory contributor' and permissions ? 'products:create' and not permissions ? 'products:manage'" | grep -qx 1

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Compose model
        run: |
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          POSTGRES_PASSWORD=ci-compose-password \
          PAPERLESS_TOKEN_PATH="$secret_file" \
          DOMINO_OIDC_CLIENT_SECRET_PATH="$secret_file" \
          DOMINO_SESSION_SECRET_PATH="$secret_file" \
          DOMINO_CREDENTIAL_ENCRYPTION_KEY_PATH="$secret_file" \
            docker compose config --quiet
          published="$(
            POSTGRES_PASSWORD=ci-compose-password \
            PAPERLESS_TOKEN_PATH="$secret_file" \
            DOMINO_OIDC_CLIENT_SECRET_PATH="$secret_file" \
            DOMINO_SESSION_SECRET_PATH="$secret_file" \
            DOMINO_CREDENTIAL_ENCRYPTION_KEY_PATH="$secret_file" \
              docker compose \
                -f compose.yaml \
                -f compose.published.yaml \
                --profile tools \
                --profile broker \
                config
          )"
          if grep -q 'build:' <<<"$published"; then
            echo "Published Compose configuration still contains local builds."
            exit 1
          fi
          grep -q 'ghcr.io/hankandre/domino:0.2.0' <<<"$published"
          grep -q 'ghcr.io/hankandre/domino-migrate:0.2.0' <<<"$published"
          grep -q 'ghcr.io/hankandre/domino-cli:0.2.0' <<<"$published"
      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize deploy/k8s >/dev/null
          kubectl kustomize deploy/overlays/external-database >/dev/null
      - run: docker build --target runtime --tag domino:ci .
      - name: Verify application image identity
        run: |
          test "$(docker image inspect domino:ci --format '{{.Config.User}}')" = "10001:10001"
          if docker run --rm --entrypoint /bin/sh domino:ci -c true; then
            echo "The Distroless application image unexpectedly contains a shell."
            exit 1
          fi
      - run: docker build --target migration --tag domino-migrate:ci .
      - name: Verify migration image identity
        run: |
          test "$(docker image inspect domino-migrate:ci --format '{{.Config.User}}')" = "10001:10001"
      - run: docker build --file Dockerfile.cli --tag domino-cli:ci .
      - name: Verify standalone CLI image
        run: |
          test "$(docker image inspect domino-cli:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker run --rm domino-cli:ci --version)" = "domino 0.2.0"
          if docker run --rm --entrypoint /bin/sh domino-cli:ci -c true; then
            echo "The Distroless CLI image unexpectedly contains a shell."
            exit 1
          fi
      - name: Verify Distroless runtime tools are absent
        run: |
          for image in domino:ci domino-migrate:ci domino-cli:ci; do
            for executable in /bin/sh /bin/bash /usr/bin/apt /usr/bin/apt-get /sbin/apk; do
              if docker run --rm --entrypoint "$executable" "$image" --version >/dev/null 2>&1; then
                echo "$image unexpectedly contains $executable"
                exit 1
              fi
            done
          done
      - name: Smoke application and migration containers
        run: bash scripts/smoke-containers.sh
      - name: Smoke Compose upgrade and restore
        run: bash scripts/smoke-compose-upgrade.sh
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Build and smoke the ARM64 images
        run: |
          docker buildx create --use
          docker buildx build --platform linux/arm64 --target runtime --load --tag domino:ci-arm64 .
          docker buildx build --platform linux/arm64 --target migration --load --tag domino-migrate:ci-arm64 .
          docker buildx build --platform linux/arm64 --file Dockerfile.cli --load --tag domino-cli:ci-arm64 .
          test "$(docker run --rm --platform linux/arm64 domino-cli:ci-arm64 --version)" = "domino 0.2.0"
          DOMINO_PLATFORM=linux/arm64 \
          DOMINO_APP_IMAGE=domino:ci-arm64 \
          DOMINO_MIGRATE_IMAGE=domino-migrate:ci-arm64 \
            bash scripts/smoke-containers.sh
      - name: Install kind
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install sigs.k8s.io/kind@v0.32.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Smoke Kubernetes deployment
        run: bash scripts/smoke-kubernetes.sh
