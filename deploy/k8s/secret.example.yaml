apiVersion: v1
kind: Secret
metadata:
  name: domino
  namespace: domino
type: Opaque
stringData:
  database-url: postgres://domino:replace-me@postgres.example.test:5432/domino?sslmode=verify-full
  paperless-token: replace-me
  oidc-client-secret: replace-me
  session-secret: replace-with-at-least-32-random-characters
